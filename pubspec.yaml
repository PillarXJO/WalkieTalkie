name: ptt_app
description: Push-to-talk front-end (mock data + backend integration layer).
publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  qr_flutter: ^4.1.0
  # Backend integration layer (lib/api). Live PTT audio itself is handled by a
  # native LiveKit plugin added at the platform layer; these are the control
  # plane dependencies.
  http: ^1.2.0
  web_socket_channel: ^2.4.5
  shared_preferences: ^2.2.3
flutter:
  uses-material-design: true
